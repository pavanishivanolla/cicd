name: R ML CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "train.R"
      - "test_model.R"
      - ".github/workflows/r-pipeline.yml"

  pull_request:
    branches: [main]
    paths:
      - "app.R"
      - "train.R"
      - "test_model.R"
      - ".github/workflows/r-pipeline.yml"

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install required R package
        run: |
          Rscript -e 'install.packages(
            "rpart",
            repos = "https://cloud.r-project.org"
          )'

      - name: Train model
        run: Rscript train.R

      - name: Test and validate saved model
        run: Rscript test_model.R

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-model
          path: artifacts/iris_model.rds
          if-no-files-found: error
          retention-days: 30
