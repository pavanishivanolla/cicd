```yaml
name: R ML CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "train.R"
      - "test_model.R"
      - "artifacts/**"
      - ".github/workflows/r-pipeline.yml"

  pull_request:
    branches: [main]
    paths:
      - "app.R"
      - "train.R"
      - "test_model.R"
      - "artifacts/**"
      - ".github/workflows/r-pipeline.yml"

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libuv1-dev

      - name: Install model and deployment packages
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            install.packages(c(
              "rpart",
              "shiny",
              "rsconnect"
            ))

            stopifnot(requireNamespace("rpart", quietly = TRUE))
            stopifnot(requireNamespace("shiny", quietly = TRUE))
            stopifnot(requireNamespace("rsconnect", quietly = TRUE))
          '

      - name: Verify required packages
        run: |
          Rscript -e '
            stopifnot(requireNamespace("rpart", quietly = TRUE))
            stopifnot(requireNamespace("shiny", quietly = TRUE))
            stopifnot(requireNamespace("rsconnect", quietly = TRUE))

            cat("All required R packages are installed.\n")
            print(packageVersion("rpart"))
            print(packageVersion("shiny"))
            print(packageVersion("rsconnect"))
          '

      - name: Train model
        run: Rscript train.R

      - name: Test and validate saved model
        run: Rscript test_model.R

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-model
          path: artifacts/iris_model.rds
          if-no-files-found: error
          retention-days: 30

      - name: Configure shinyapps.io account
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        run: |
          Rscript -e '
            stopifnot(requireNamespace("rsconnect", quietly = TRUE))

            stopifnot(
              nzchar(Sys.getenv("RSCONNECT_USER")),
              nzchar(Sys.getenv("RSCONNECT_TOKEN")),
              nzchar(Sys.getenv("RSCONNECT_SECRET"))
            )

            rsconnect::setAccountInfo(
              name = Sys.getenv("RSCONNECT_USER"),
              token = Sys.getenv("RSCONNECT_TOKEN"),
              secret = Sys.getenv("RSCONNECT_SECRET")
            )

            cat("shinyapps.io account configured successfully.\n")
          '

      - name: Deploy Shiny app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        run: |
          Rscript -e '
            stopifnot(requireNamespace("shiny", quietly = TRUE))
            stopifnot(requireNamespace("rpart", quietly = TRUE))
            stopifnot(requireNamespace("rsconnect", quietly = TRUE))

            rsconnect::setAccountInfo(
              name = Sys.getenv("RSCONNECT_USER"),
              token = Sys.getenv("RSCONNECT_TOKEN"),
              secret = Sys.getenv("RSCONNECT_SECRET")
            )

            rsconnect::deployApp(
              appDir = ".",
              appName = "iris-predictor-r",
              forceUpdate = TRUE
            )
          '
```
