name: R ML CI Pipeline

# Run automatically whenever code is pushed
# or a pull request is created.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# Prevent unnecessary simultaneous runs
concurrency:
  group: r-ml-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: TRAIN AND TEST R MODEL
  # ==========================================

  test-and-train:
    name: Train and Test R Model
    runs-on: ubuntu-24.04

    steps:

      # STEP 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Install R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      # STEP 3: Install required packages
      - name: Install R dependencies
        run: |
          Rscript -e '
            options(repos = c(
              CRAN = "https://cloud.r-project.org"
            ))

            install.packages("rpart")

            stopifnot(
              requireNamespace("rpart", quietly = TRUE)
            )

            cat("R dependencies installed successfully.\n")
          '

      # STEP 4: Verify R environment
      - name: Check R environment
        run: |
          Rscript -e '
            cat("R version:\n")
            print(R.version.string)

            cat("rpart version:\n")
            print(packageVersion("rpart"))
          '

      # STEP 5: Train machine learning model
      - name: Train model
        run: |
          Rscript train.R

      # STEP 6: Test trained model
      - name: Test and validate model
        run: |
          Rscript test_model.R

      # STEP 7: Verify generated model file
      - name: Verify model artifact
        run: |
          Rscript -e '
            model_file <- "artifacts/iris_model.rds"

            if (!file.exists(model_file)) {
              stop("Model artifact was not created!")
            }

            saved <- readRDS(model_file)

            stopifnot(
              is.list(saved),
              inherits(saved$model, "rpart"),
              is.numeric(saved$accuracy),
              length(saved$accuracy) == 1,
              is.finite(saved$accuracy),
              saved$accuracy >= 0.70,
              saved$accuracy <= 1
            )

            cat("Model artifact verified successfully.\n")

            cat(
              "Model accuracy:",
              round(saved$accuracy * 100, 2),
              "%\n"
            )
          '

      # STEP 8: Upload trained model
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-model
          path: artifacts/iris_model.rds
          if-no-files-found: error
          retention-days: 30


  # ==========================================
  # JOB 2: DEPLOY SHINY APPLICATION
  # ==========================================

  deploy-shiny:
    name: Deploy Shiny Application
    runs-on: ubuntu-24.04

    # Run only after successful training and testing
    needs: test-and-train

    # Deploy only on pushes to main or manual runs on main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    # GitHub repository secrets
  
    env:
      SHINYAPPS_ACCOUNT: ${{ secrets.RSCONNECT_USER }}
      SHINYAPPS_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.RSCONNECT_SECRET }}

    steps:

      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      # STEP 3: Download trained model artifact
      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: iris-model
          path: artifacts/

      # STEP 4: Install Linux system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libuv1-dev

      # STEP 5: Check deployment files
      - name: Check deployment files
        run: |
          test -f app.R
          test -f artifacts/iris_model.rds

      # STEP 6: Install Shiny dependencies
      - name: Install Shiny dependencies
        run: |
          Rscript -e '
            options(repos = c(
              CRAN = "https://cloud.r-project.org"
            ))

            install.packages(c(
              "rpart",
              "shiny",
              "rsconnect"
            ))

            stopifnot(
              requireNamespace("rpart", quietly = TRUE),
              requireNamespace("shiny", quietly = TRUE),
              requireNamespace("rsconnect", quietly = TRUE)
            )

            cat("All Shiny dependencies installed successfully.\n")
          '

      # STEP 7: Verify shinyapps.io credentials
      - name: Verify shinyapps.io credentials
        run: |
          Rscript -e '
            required <- c(
              "SHINYAPPS_ACCOUNT",
              "SHINYAPPS_TOKEN",
              "SHINYAPPS_SECRET"
            )

            missing <- required[
              !nzchar(Sys.getenv(required))
            ]

            if (length(missing) > 0) {
              stop(
                paste(
                  "Missing GitHub secrets:",
                  paste(missing, collapse = ", ")
                )
              )
            }

            cat("Deployment credentials are available.\n")
          '

      # STEP 8: Configure shinyapps.io
      - name: Configure shinyapps.io
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )

            cat("shinyapps.io configured successfully.\n")
          '

      # STEP 9: Deploy Shiny application
      - name: Deploy Shiny application
        run: |
          Rscript -e '
            rsconnect::deployApp(
              appDir = ".",
              appName = "iris-ml-classifier-pavani",
              account = Sys.getenv("SHINYAPPS_ACCOUNT"),
              server = "shinyapps.io",
              forceUpdate = TRUE,
              launch.browser = FALSE
            )
          '
