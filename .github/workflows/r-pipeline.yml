  deploy-shiny:
    name: Deploy Shiny Application
    runs-on: ubuntu-24.04

    # Run deployment only after successful CI on main
    needs: test-and-train
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      # Step 3: Download trained model
      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: iris-model
          path: artifacts/

      # Step 4: Install required packages
      - name: Install Shiny dependencies
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            install.packages(c(
              "shiny",
              "rpart",
              "rsconnect"
            ))

            stopifnot(
              requireNamespace("shiny", quietly = TRUE),
              requireNamespace("rpart", quietly = TRUE),
              requireNamespace("rsconnect", quietly = TRUE)
            )
          '

      # Step 5: Configure shinyapps.io
      - name: Configure shinyapps.io
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
          '

      # Step 6: Deploy application
      - name: Deploy Shiny application
        run: |
          Rscript -e '
            rsconnect::deployApp(
              appDir = ".",
              appName = "iris-ml-classifier-pavani",
              account = Sys.getenv("SHINYAPPS_ACCOUNT"),
              server = "shinyapps.io",
              forceUpdate = TRUE,
              launch.browser = FALSE
            )
          '
