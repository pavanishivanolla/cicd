
name: R ML CI-CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "train.R"
      - "test_model.R"
      - ".github/workflows/r-pipeline.yml"

  pull_request:
    branches: [main]
    paths:
      - "app.R"
      - "train.R"
      - "test_model.R"
      - ".github/workflows/r-pipeline.yml"

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shiny, any::rpart, any::rsconnect
          cache-version: 1

      - name: Run model tests
        run: Rscript test_model.R

      - name: Deploy validated application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPNAME: iris-predictor-r
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(
            name = Sys.getenv("RSCONNECT_USER"),
            token = Sys.getenv("RSCONNECT_TOKEN"),
            secret = Sys.getenv("RSCONNECT_SECRET")
          )'

          Rscript -e 'rsconnect::deployApp(
            appDir = ".",
            appName = Sys.getenv("APPNAME"),
            account = Sys.getenv("RSCONNECT_USER"),
            server = "shinyapps.io",
            forceUpdate = TRUE
          )'
